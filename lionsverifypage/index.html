<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/variable.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<body>
    <div class="container-fluid lion-log px-0">
        <div class="row g-0 hello-lion">
            <div class="col-6 lion-work">
                <div class="lion-form">
                    <div class="lion-card">
                        <div class="logo-lion mb-4">
                            <img src="./assets/image/lions.webp" class="lion-icon" alt="">
                        </div>
                        <h5 class="sign-text d-flex justify-content-center mb-3">ADMIN LOGIN</h4>
                            <form method="POST" action="#">
                                <div class="bottom-card">
                                    <label class="form-label">Email address <span class="star-ic">*</span></label>
                                    <input type="email" class="form-control lion-hov" name="userEmail" id="userEmail">
                                </div>
                                <div class="bottom-card">
                                    <label class="form-label">Password <span class="star-ic">*</span></label>
                                    <input type="password" class="form-control lion-hov" name="userPassword"
                                        id="userPassword">
                                </div>
                                <div class="lion-signbtn">
                                    <div class=" tect-check ">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input">
                                            <label class="form-check-label lion-check">Keep me logged in</label>
                                        </div>

                                    </div>
                                    <p class="password-text">Forgot Password ?</p>
                                </div>
                                <div class="lions_account">
                                    <p class="just-text">Don't have an account?</p>
                                    <p class="sign-up">Sign up</p>
                                </div>
                                <div class="next-btn"></div>
                                <button type="submit" class="submit-btn btn btn-warning">SUBMIT</button>
                            </form>
                    </div>
                </div>
            </div>

            <div class="col-6 lionhead p-0" id="lion-head">
                <div class="right-rect"></div>
                <!-- <div class="seq-one"></div> -->
                <div class="seq-bg"></div>
            </div>
        </div>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/login.js"></script>
    <script src="assets/js/lions.js"></script>
</body>

</html>
